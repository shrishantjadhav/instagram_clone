<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>{% block title %}Instagram Clone{% endblock %}</title>

{% block extra_css %}
{% endblock %}


</head>

<body>
    {% if messages %}
        {% for message in messages %}
            <p class = {{ message.tags  }}>
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

    {% block extra_js %}
    {% endblock %}


</body>
</html>
